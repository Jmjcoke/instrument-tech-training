<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Instrument Tech Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Desktop workbench: a fixed app shell. Left rail, big interactive stage, lesson + try-it panels on the right, lesson strip along the bottom.
   The figures, tools and quiz content come from course.js, shared with the phone version (index.html). */
:root{
  --bg:#F6EFE3; --surface:#FFFCF6; --sunk:#EEE5D5; --ink:#1B2838; --muted:#667080; --line:#DDD2BF; --grid:#E4D9C6;
  --accent:#0E6676; --accent-ink:#FFFFFF; --accent-soft:#CFE5E6;
  --hot:#CF5F2A; --hot-ink:#FFFFFF; --hot-soft:#F9E3D5;
  --tag:#E2A200; --tag-ink:#1B1600;
  --ok:#24704A; --ok-soft:#DCEFE3; --bad:#A93C29; --bad-soft:#F6E0DB; --warn:#8A5A00; --warn-soft:#F7ECCF;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:0.875rem; --shadow:0 1px 0 rgba(27,40,56,.04),0 0.375rem 1.125rem -12px rgba(27,40,56,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161C; --surface:#18212A; --sunk:#131B23; --ink:#E8ECEA; --muted:#97A3AB; --line:#2B3843; --grid:#1D2832;
  --accent:#62B9C9; --accent-ink:#0B1A1D; --accent-soft:#1D3A40;
  --hot:#F0875A; --hot-ink:#1B0E06; --hot-soft:#3B2318;
  --tag:#F0B429; --tag-ink:#1B1600;
  --ok:#5CC48A; --ok-soft:#173326; --bad:#F0806A; --bad-soft:#3A1F1A; --warn:#F0C060; --warn-soft:#352A12;
  --shadow:0 0.375rem 1.125rem -12px rgba(0,0,0,.8); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10161C; --surface:#18212A; --sunk:#131B23; --ink:#E8ECEA; --muted:#97A3AB; --line:#2B3843; --grid:#1D2832;
  --accent:#62B9C9; --accent-ink:#0B1A1D; --accent-soft:#1D3A40;
  --hot:#F0875A; --hot-ink:#1B0E06; --hot-soft:#3B2318;
  --tag:#F0B429; --tag-ink:#1B1600;
  --ok:#5CC48A; --ok-soft:#173326; --bad:#F0806A; --bad-soft:#3A1F1A; --warn:#F0C060; --warn-soft:#352A12;
  --shadow:0 0.375rem 1.125rem -12px rgba(0,0,0,.8); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
/* type and layout are in rem, and the root size follows the window, so everything scales together */
html{font-size:clamp(13px,calc(5.5px + .42vw + .42vh),22px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5;overflow:hidden}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-size:1.6rem;text-transform:uppercase}h3{font-size:1.2rem}
p{margin:0 0 .75em}ul,ol{margin:0 0 .75em;padding-left:1.2em}li{margin-bottom:.3em}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:.88rem}
.mono{font-family:var(--mono);font-size:.84rem;line-height:1.7;background:var(--sunk);padding:0.625rem 0.75rem;border-radius:0.5rem;overflow-wrap:anywhere}
.formula{font-family:var(--mono);font-weight:700;font-size:.95rem;background:var(--accent-soft);padding:0.625rem 0.75rem;border-radius:0.5rem;text-align:center;overflow-wrap:anywhere}
.ic{width:1.5rem;height:1.5rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.app{height:100vh;min-height:38.75rem;display:grid;gap:0.75rem;padding:0.75rem 0.875rem 0.75rem 0.5rem;
  grid-template-columns:5.25rem minmax(0,1fr) clamp(24.5rem,27vw,28rem);
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"logo head status" "rail stage side" "rail strip strip"}
.app.page-mode{grid-template-areas:"logo head status" "rail page page" "rail page page"}
.app.page-mode #stage,.app.page-mode #side,.app.page-mode #strip{display:none}
.app:not(.page-mode) #page{display:none}
.app.focus{grid-template-areas:"logo head status" "rail stage stage" "rail stage stage"}
.app.focus #side,.app.focus #strip{display:none}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;min-height:0}

/* header */
.logo{grid-area:logo;display:grid;place-items:center;color:var(--hot)}
.logo svg{width:3.375rem;height:3.375rem}
.head{grid-area:head;display:flex;align-items:center;gap:1.125rem;min-width:0;position:relative;overflow:hidden}
.brand{font-family:var(--display);font-weight:700;font-size:2.5rem;line-height:.95;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.brand b{color:var(--hot)}
.tagline{font-family:var(--mono);font-size:.72rem;letter-spacing:.42em;color:var(--muted);text-transform:uppercase;margin-top:0.375rem;white-space:nowrap}
.doodle{flex:1;min-width:0;height:4rem;color:var(--muted);opacity:.8}
.status{grid-area:status;display:flex;align-items:stretch}
.status .prog{flex:1;display:flex;gap:0.75rem;align-items:center;padding:0.625rem 0.875rem;min-width:0}
.status .prog .txt{flex:1;min-width:0}
.status .lbl{font-family:var(--display);font-weight:700;font-size:.95rem;line-height:1.1;letter-spacing:.05em;text-transform:uppercase;text-wrap:balance;margin-bottom:.25rem}
.status .bar{display:flex;align-items:center;gap:0.625rem}
.meter{flex:1;height:0.5625rem;border-radius:0.3125rem;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--hot);border-radius:0.3125rem;transition:width .4s}
.status .cnt{font-family:var(--mono);font-weight:700;font-size:.9rem}
.status .clock{border-left:1.5px dashed var(--line);padding:0.625rem 0.875rem;font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;color:var(--muted);display:grid;align-content:center;white-space:nowrap;text-transform:uppercase}

/* rail */
.rail{grid-area:rail;display:flex;flex-direction:column;gap:0.375rem;align-items:stretch;padding-top:2px}
.rail button{background:none;border:1.5px solid transparent;border-radius:0.75rem;padding:0.625rem 0.25rem 0.5rem;display:grid;justify-items:center;gap:0.25rem;font-size:.78rem;font-weight:500;color:var(--ink)}
.rail button:hover{background:var(--surface)}
.rail button.on{background:var(--surface);border-color:var(--line);color:var(--hot);box-shadow:var(--shadow)}
.rail .sp{flex:1}
.rail a.phone{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;text-align:center;color:var(--muted);text-decoration:none;padding:0.5rem 2px;border:1.5px dashed var(--line);border-radius:0.625rem}
.rail a.phone:hover{color:var(--hot);border-color:var(--hot)}

/* stage */
#stage{grid-area:stage;position:relative;overflow:hidden;background-color:var(--sunk);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:2rem 2rem;background-position:-1px -1px}
.zoomwrap{position:absolute;inset:0;cursor:grab;touch-action:none}
.zoomwrap.panning{cursor:grabbing}
.zoomer{position:absolute;inset:2.875rem 1.875rem 5.375rem;transform-origin:0 0}
.zoomer>svg.art{width:100%;height:100%;display:block;background:none;margin:0;overflow:visible}
.stage-top{position:absolute;left:0.875rem;top:0.75rem;display:flex;gap:0.5rem;align-items:center;pointer-events:none;z-index:2}
.chip{display:inline-block;font-family:var(--mono);font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:0.25rem 0.5625rem;border-radius:6.1875rem;white-space:nowrap;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.chip.hot{background:var(--hot);border-color:var(--hot);color:var(--hot-ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.new{background:var(--sunk)}.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.stage-hint{position:absolute;left:50%;bottom:3.125rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:.74rem;font-weight:600;padding:3px 0.75rem;border-radius:6.1875rem;white-space:nowrap;pointer-events:none;z-index:2}
.stage-tools{position:absolute;left:50%;bottom:0.625rem;transform:translateX(-50%);display:flex;gap:2px;background:var(--surface);border:1.5px solid var(--line);border-radius:0.625rem;padding:3px;z-index:3;box-shadow:var(--shadow)}
.tool-btn{background:none;border:0;border-radius:0.4375rem;width:2rem;height:1.875rem;display:grid;place-items:center}
.tool-btn:hover{background:var(--sunk)}.tool-btn .ic{width:1.125rem;height:1.125rem}
.tool-btn.on{color:var(--hot);background:var(--hot-soft)}
.stage-tools i{width:1px;background:var(--line);margin:0.25rem 3px}
.stage-tools.corner{left:auto;right:0.75rem;top:0.5rem;bottom:auto;transform:none}
.leader{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible}
.leader path{fill:none;stroke:var(--hot);stroke-width:2;stroke-dasharray:5 5}
.leader circle{fill:var(--hot);stroke:var(--surface);stroke-width:2}
.callout{position:absolute;z-index:5;width:18.125rem;background:var(--surface);border:1.5px solid var(--line);border-radius:0.75rem;padding:0.625rem 0.875rem;box-shadow:0 0.625rem 1.625rem -14px rgba(27,40,56,.6);pointer-events:none;font-size:.9rem;line-height:1.4}
.callout b{display:block;font-family:var(--display);font-size:1.05rem;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.callout.pinned{border-color:var(--hot)}
/* tool / quiz bench inside the stage */
.bench{position:absolute;inset:0;overflow:auto;padding:2.875rem 1.75rem 1.75rem}
.sheet{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:1.375rem 1.5rem;max-width:65rem;margin:0 auto;box-shadow:var(--shadow)}
.sheet.narrow{max-width:51.25rem}
.sheet>h2{margin-bottom:0.375rem}

/* side */
#side{grid-area:side;display:grid;gap:0.75rem;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
#side.tall-try{grid-template-rows:minmax(0,.55fr) minmax(0,1.45fr)}
#side.solo{grid-template-rows:minmax(0,1fr)}
#side.solo #try{display:none}
.ipanel{display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:0.25rem;padding:0.375rem 0.75rem 0;border-bottom:1.5px solid var(--line);flex:none}
#tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1.5px;padding:0.5rem 0.5rem;font-family:var(--display);font-weight:600;font-size:.98rem;letter-spacing:.06em;white-space:nowrap;text-transform:uppercase;color:var(--muted)}
#tabs button.on{color:var(--ink);border-bottom-color:var(--hot)}
#tabs button:hover{color:var(--ink)}
.info-body{flex:1;overflow:auto;padding:0.875rem 1.125rem 0.75rem;min-height:0}
.info-body h2{margin-bottom:0.5rem}
.info-body code,.sheet code{font-family:var(--mono);font-size:.85em;background:var(--hot-soft);color:var(--hot);padding:1px 0.3125rem;border-radius:0.25rem}
.info-nav{margin-left:auto;flex:none;display:flex;gap:0.375rem;align-items:center;padding-bottom:0.375rem}
.info-nav .btn{min-height:2rem;padding:0.2rem 0.7rem;font-size:.88rem}
.info-nav .btn.icon{padding:0.2rem 0.45rem}
.btn{appearance:none;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);font-weight:700;font-size:.95rem;padding:0.5rem 1rem;border-radius:0.5625rem;min-height:2.5rem;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:0.5rem}
.btn:hover:not(:disabled){background:var(--sunk)}
.btn.primary{background:var(--hot);border-color:var(--hot);color:var(--hot-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.06);background:var(--hot)}
.btn.grow{flex:1}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.small{min-height:2.125rem;padding:0.3125rem 0.75rem;font-size:.88rem}
.btn .ic{width:1.125rem;height:1.125rem}
.try{display:flex;flex-direction:column;overflow:hidden}
.try-head{flex:none;display:flex;align-items:center;gap:0.375rem;padding:0.5rem 0.625rem 0.5rem 1rem;border-bottom:1.5px solid var(--line)}
.try-head h3{flex:1;letter-spacing:.08em;text-transform:uppercase}
.sq{width:2.125rem;height:2rem;border:1.5px solid var(--line);background:var(--surface);border-radius:0.5rem;display:grid;place-items:center}
.sq:hover{background:var(--sunk)}.sq .ic{width:1.0625rem;height:1.0625rem}
.sq.hot{background:var(--hot);border-color:var(--hot);color:var(--hot-ink)}
.try-body{flex:1;overflow:auto;padding:0.875rem 1rem;min-height:0}
.outline{display:grid;border-top:1px solid var(--line);margin-top:0.375rem}
.outline button{display:flex;gap:0.625rem;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:0.5rem 2px;font-size:.95rem}
.outline button:hover{color:var(--hot)}
.outline button.cur{font-weight:700}
.dotc{flex:none;width:1.125rem;height:1.125rem;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:.7rem;font-weight:700;color:var(--surface)}
.dotc.ok{background:var(--ok);border-color:var(--ok)}
.bookcard{border-left:0.25rem solid var(--tag);background:var(--sunk);padding:0.625rem 0.75rem;border-radius:0 0.5rem 0.5rem 0;margin:0.5rem 0 0.75rem}

/* strip */
#strip{grid-area:strip;min-width:0}
.strip-head{display:flex;align-items:center;gap:0.75rem;margin:0 0.25rem 0.375rem}
.strip-head h3{letter-spacing:.08em;text-transform:uppercase}
.modsw{display:flex;align-items:center;gap:0.375rem;font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.modsw button{width:1.625rem;height:1.5rem;border:1.5px solid var(--line);background:var(--surface);border-radius:0.4375rem;display:grid;place-items:center;padding:0}
.modsw button:disabled{opacity:.35;cursor:default}.modsw .ic{width:0.875rem;height:0.875rem}
.modsw b{color:var(--ink)}
.strip-row{display:flex;align-items:center;gap:0.625rem}
.round{flex:none;width:2.125rem;height:2.125rem;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.round .ic{width:1rem;height:1rem}
.tiles{flex:1;display:flex;gap:0.75rem;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;padding:3px 2px 0.3125rem}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;width:14.875rem;height:4.375rem;display:flex;align-items:center;gap:0.625rem;padding:0.375rem 1.625rem 0.375rem 0.5rem;background:var(--surface);border:1.5px solid var(--line);border-radius:0.75rem;text-align:left;position:relative;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--muted)}
.tile.cur{border-color:var(--hot);box-shadow:0 0 0 1.5px var(--hot)}
.tile img,.tile .tic{flex:none;width:4.875rem;height:3.375rem;border-radius:0.4375rem;background:var(--sunk);object-fit:contain}
.tile .tic{display:grid;place-items:center;color:var(--hot)}.tile .tic .ic{width:1.875rem;height:1.875rem}
.tile span.t{font-family:var(--display);font-weight:600;font-size:.98rem;line-height:1.1;letter-spacing:.04em;text-transform:uppercase;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile.cur span.t{font-weight:700}
.tile .dotc{position:absolute;right:0.5rem;top:0.5rem}

/* pages (lessons / tools / textbook / settings) */
#page{grid-area:page;overflow:auto;padding:1.375rem 1.625rem}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1rem}
.page-head h2{font-size:2rem}
.cards{display:grid;gap:0.875rem;grid-template-columns:repeat(auto-fill,minmax(18.125rem,1fr))}
.mcard{display:grid;gap:0.5rem;align-content:start;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:0.75rem;padding:0.75rem}
.mcard:hover{border-color:var(--hot)}
.mcard img{width:100%;aspect-ratio:320/200;object-fit:contain;background:var(--sunk);border-radius:0.5rem}
.mcard .top{display:flex;gap:0.75rem;align-items:center}
.mcard .t{font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.1;letter-spacing:.03em;text-transform:uppercase}
.mcard .s{color:var(--muted);font-size:.9rem}
.mcard .foot{display:flex;align-items:center;justify-content:space-between;gap:0.5rem}
.dots{display:flex;gap:0.25rem}.dots i{width:0.875rem;height:0.375rem;border-radius:3px;background:var(--line)}.dots i.on{background:var(--ok)}
.bubble{flex:none;width:3.375rem;height:3.375rem;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;align-content:center;background:var(--surface);font-family:var(--mono);line-height:1}
.bubble .l{font-size:.58rem;font-weight:700;letter-spacing:.04em}.bubble .n{font-size:1rem;font-weight:700;margin-top:3px}
.bubble.done{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.chlist{display:grid;border-top:1px solid var(--line);max-width:53.75rem}
.chlist a{display:grid;grid-template-columns:3em 1fr auto auto;gap:0.875rem;align-items:center;padding:0.6875rem 0.25rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.chlist a:hover span:nth-child(2){color:var(--hot)}
.mono-sm{font-family:var(--mono);font-weight:700;font-size:.8rem;color:var(--muted)}
.setgrid{display:grid;gap:0.875rem;max-width:40rem}
.setrow{display:grid;gap:0.375rem;background:var(--bg);border:1.5px solid var(--line);border-radius:0.75rem;padding:0.875rem}
label{font-weight:600;font-size:.92rem}

/* course components (figures, tools, quiz) restyled for the workbench */
input[type=text],input[type=number],select,textarea{font:inherit;font-size:0.9375rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:0.5rem;padding:0.5rem 0.6875rem;width:100%}
.widget{display:grid;gap:0.75rem}
.widget.split{display:block}
.widget.split::after{content:"";display:block;clear:both}
.widget.split>*{margin-left:54%;width:46%;margin-bottom:0.75rem}
.widget.split>svg.art:first-child{float:left;width:51%;margin:0 0 0.75rem}
.row{display:flex;flex-wrap:wrap;gap:0.625rem}.row>*{flex:1 1 8.75rem;min-width:0}
.field{display:grid;gap:0.25rem}
.field span{font-size:.84rem;color:var(--muted);font-weight:600}
input[type=range]{width:100%;accent-color:var(--hot);height:1.625rem}
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr));gap:0.5rem}
.ro{background:var(--sunk);border-radius:0.5rem;padding:0.5rem 0.6875rem}
.ro small{display:block;font-size:.68rem;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ro b{font-family:var(--mono);font-size:1.2rem;font-variant-numeric:tabular-nums}
.ro.ok{background:var(--ok-soft)}.ro.bad{background:var(--bad-soft)}.ro.warn{background:var(--warn-soft)}
.ro.ok b{color:var(--ok)}.ro.bad b{color:var(--bad)}
.note{padding:0.5625rem 0.75rem;border-radius:0.5rem;font-size:.93rem}
.note.ok{background:var(--ok-soft);border-left:0.25rem solid var(--ok)}
.note.bad{background:var(--bad-soft);border-left:0.25rem solid var(--bad)}
.note.warn{background:var(--warn-soft);border-left:0.25rem solid var(--warn)}
.note.info{background:var(--accent-soft);border-left:0.25rem solid var(--accent)}
.seg{display:flex;gap:0.375rem;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:1.5px solid var(--line);background:var(--bg);padding:0.375rem 0.625rem;border-radius:0.5rem;font-weight:600;min-height:2.25rem}
.seg button:hover{border-color:var(--muted)}
.seg button.sel{border-color:var(--hot);background:var(--hot-soft)}
.seg button.right{border-color:var(--ok);background:var(--ok-soft)}
.seg button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.sortitem{display:grid;gap:0.375rem;padding:0.5625rem 0;border-bottom:1px dashed var(--line)}
.sortitem:last-child{border-bottom:0}.sortitem .nm{font-weight:600}
.tagbreak{display:flex;flex-wrap:wrap;gap:0.5rem}
.tagbreak div{background:var(--sunk);border-radius:0.5rem;padding:0.5rem 0.625rem;min-width:0}
.tagbreak b{font-family:var(--mono);font-size:1.2rem;color:var(--accent);margin-right:0.375rem}
.orderlist{display:grid;gap:0.5rem}
.orderlist button{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:0.5rem;padding:0.5625rem 0.75rem;font-weight:500;display:flex;gap:0.625rem;align-items:center;min-height:2.75rem}
.orderlist button .k{font-family:var(--mono);font-weight:700;width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;background:var(--sunk);flex:none;font-size:.8rem}
.orderlist button.done{border-color:var(--ok);background:var(--ok-soft)}
.orderlist button.done .k{background:var(--ok);color:var(--surface)}
.orderlist button.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(0.3125rem)}}
.caltable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
.caltable th{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0.25rem}
.caltable td{padding:0.25rem;border-top:1px solid var(--line)}
.caltable input{padding:0.375rem 0.5rem;font-family:var(--mono);min-width:0;width:100%}
.tablewrap{overflow-x:auto}
canvas{width:100%;display:block;background:var(--bg);border-radius:0.5rem;border:1px solid var(--line)}
.tank{display:flex;gap:0.875rem;align-items:flex-end}.tank svg{flex:none}
.art{display:block;width:100%;height:auto;max-width:100%;background:var(--sunk);border-radius:0.5rem;margin:2px 0 0.75rem}
.art text{font-family:var(--mono);font-size:10px}
.art text:not([fill]){fill:var(--ink)}
.art .lbl{font-weight:700}.art .sm{font-size:8.5px}.art .sm:not([fill]){fill:var(--muted)}
.art [data-tip]{cursor:help}
.art [data-tip]:hover,.art [data-tip].on{filter:drop-shadow(0 0 3px var(--tag))}
.tipbox{font-size:.93rem;padding:0.5625rem 0.75rem;border-radius:0.5rem;background:var(--warn-soft);border-left:0.25rem solid var(--tag)}
.tiphint{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
@keyframes flowdash{to{stroke-dashoffset:-24}}
.art .flow{stroke-dasharray:6 6;animation:flowdash 1.2s linear infinite}
.art .flow.fast{animation-duration:.5s}.art .flow.slow{animation-duration:2.4s}.art .flow.rev{animation-direction:reverse}
@keyframes pulse{50%{opacity:.35}}
.art .pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.art .bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box}
@keyframes spin{to{transform:rotate(360deg)}}
.art .spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes sway{0%,100%{transform:rotate(-35deg)}50%{transform:rotate(35deg)}}
.art .sway{animation:sway 4s ease-in-out infinite;transform-box:view-box}
.ihost{display:grid;gap:0.625rem}
.ictl{display:grid;gap:0.625rem}.ictl:empty{display:none}
.islider span,.ilabel{font-size:.86rem;font-weight:700;color:var(--ink)}
.ibtns{display:flex;flex-wrap:wrap;gap:0.5rem}
.itasks{background:var(--bg);border:2px dashed var(--tag);border-radius:0.625rem;padding:0.625rem 0.75rem;display:grid;gap:0.375rem}
.itask{display:flex;gap:0.625rem;align-items:flex-start;font-size:.93rem;line-height:1.35}
.ibox{flex:none;width:1.1875rem;height:1.1875rem;border-radius:0.3125rem;border:2px solid var(--muted);display:grid;place-items:center;font-size:.78rem;font-weight:700;color:var(--surface)}
.itask.ok{color:var(--muted)}.itask.ok .ibox{background:var(--ok);border-color:var(--ok)}
.idone{font-weight:700;color:var(--ok);font-size:.92rem}
.art .idrag{cursor:grab;touch-action:none}.art .idrag:active{cursor:grabbing}
.art .ihandle{cursor:grab;touch-action:none}
@keyframes iring{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.7);opacity:0}}
.art .iring{animation:iring 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.ihist .art{margin:0}
/* quiz */
.q{font-family:var(--display);font-size:1.75rem;font-weight:600;line-height:1.2;margin:0.5rem 0 1.125rem;letter-spacing:.01em}
.opts{display:grid;gap:0.625rem;grid-template-columns:1fr 1fr}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:0.75rem;padding:0.875rem 1rem;font-size:1.02rem;display:flex;gap:0.75rem;align-items:flex-start;min-height:4rem}
.opt .k{font-family:var(--mono);font-weight:700;flex:none;width:1.625rem;height:1.625rem;border-radius:0.4375rem;background:var(--sunk);display:grid;place-items:center;font-size:.85rem}
.opt:hover:not(:disabled){border-color:var(--hot)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{margin-top:0.875rem}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:0.625rem}
.score{display:flex;gap:1.125rem;align-items:center;margin:0.625rem 0 1rem}
.ring{flex:none;width:6.5rem;height:6.5rem;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:1.5rem}
.ring span{background:var(--surface);width:5.125rem;height:5.125rem;border-radius:50%;display:grid;place-items:center}
.report{white-space:pre-wrap;font-family:var(--mono);font-size:.8rem;background:var(--sunk);border-radius:0.5rem;padding:0.75rem;user-select:all;overflow-wrap:anywhere;margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.375rem;align-items:start}
.stack{display:grid;gap:0.625rem;grid-template-columns:minmax(0,1fr)}
.widget.split>*{min-width:0;overflow-wrap:anywhere}
.missed{display:grid;gap:0.5rem}
.missed div{background:var(--bg);border-radius:0.5rem;padding:0.625rem 0.75rem;font-size:.93rem}
.qdots{display:grid;grid-template-columns:repeat(8,1fr);gap:0.375rem;margin:0.625rem 0}
.qdots i{height:1.875rem;border-radius:0.4375rem;background:var(--sunk);display:grid;place-items:center;font-family:var(--mono);font-style:normal;font-weight:700;font-size:.8rem;color:var(--muted);border:1.5px solid transparent}
.qdots i.cur{border-color:var(--hot);color:var(--ink)}.qdots i.r{background:var(--ok-soft);color:var(--ok)}.qdots i.w{background:var(--bad-soft);color:var(--bad)}

.phonebar{display:none}
@media (max-width:980px){
  html{font-size:16px}
  body{overflow:auto}
  .phonebar{display:block;background:var(--hot);color:var(--hot-ink);padding:0.625rem 0.875rem;font-weight:600;text-align:center}
  .phonebar a{color:inherit}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"head" "status" "rail" "stage" "side" "strip"}
  .app.page-mode{grid-template-areas:"head" "status" "rail" "page"}
  .logo,.doodle{display:none}.rail{flex-direction:row;flex-wrap:wrap}.rail .sp{display:none}
  #stage{height:70vw;min-height:20rem}#side{grid-template-rows:auto auto}.ipanel,.try{max-height:none}
  .opts,.two{grid-template-columns:1fr}.brand{font-size:1.8rem}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
:root[data-motion="off"] *{animation:none!important;transition:none!important}

<body>
<div class="phonebar">This is the desktop workbench. On a phone, <a href="./">use the phone version</a>.</div>
<div class="app" id="app">
  <div class="logo" aria-hidden="true">

  </div>

      <path d="M20 46H150"/><path d="M150 38l16 16v-16l-16 16z"/><path d="M158 38V26M150 26h16a8 8 0 0 0-16 0z"/><path d="M166 46H300"/>
      <circle cx="86" cy="18" r="11"/><path d="M86 29V46"/><path d="M97 18H148V26" stroke-dasharray="4 4"/>
      <rect x="300" y="20" width="74" height="34" rx="17"/><path d="M304 40q8-5 16 0t16 0 16 0 18 0" stroke="var(--accent)"/>
      <path d="M374 30H420" /><circle cx="431" cy="30" r="11"/><path d="M442 30H470" stroke-dasharray="4 4"/>
      <path d="M476 44l8-14 7 8 9-20 8 12 8-6" stroke="var(--hot)" stroke-width="2"/><circle cx="500" cy="12" r="4" fill="var(--tag)" stroke="none"/>
      <g fill="currentColor" stroke="none" opacity=".5"><circle cx="210" cy="14" r="1.4"/><circle cx="222" cy="14" r="1.4"/><circle cx="234" cy="14" r="1.4"/><circle cx="246" cy="14" r="1.4"/><circle cx="210" cy="24" r="1.4"/><circle cx="222" cy="24" r="1.4"/><circle cx="234" cy="24" r="1.4"/><circle cx="246" cy="24" r="1.4"/></g>
    </svg>
  </header>
  <div class="status panel" id="status"></div>

  <aside id="side">
    <section class="panel ipanel"><div class="tabs"><div id="tabs" role="tablist" style="display:flex;gap:0.25rem"></div><div class="info-nav" id="infoNav"></div></div><div class="info-body" id="infoBody"></div></section>
    <section class="panel try" id="try"><div class="try-head"><h3 id="tryTitle">Try it yourself</h3><span id="tryBtns" style="display:flex;gap:6px"></span></div><div class="try-body" id="tryBody"></div></section>
  </aside>
  <section id="strip" aria-label="Lessons in this module"></section>
  <section class="panel" id="page"></section>
</div>
<script src="course.js"></script>
<script>
(() => {
const PASS = 75, COURSE = "Instrument Tech Fundamentals";
const BOOK_URL = "https://www.ibiblio.org/kuphaldt/socratic/sinst/book/liii.pdf";
const CH_MB = { m1: 1.6, m2: 1.2, m3: 2.1, m4: 1.0, m5: 0.6, m6: 6.7, m7: 2.3, m8: 9.8, m9: 11.3, m10: 16.8, m11: 4.0 };

/* ---------- state: quiz scores and name are shared with the phone version (same key); desktop-only bits live in their own key ---------- */
const LS = "itt.v1", LSD = "itt.desktop";
const load = (k) => { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch { return {}; } };
const S = Object.assign({ name: "", best: {}, tries: {}, fb: {} }, load(LS));
const D = Object.assign({ theme: "auto", motion: "on", seen: {}, pos: {}, last: null }, load(LSD));
const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); localStorage.setItem(LSD, JSON.stringify(D)); } catch {} };

const ICON = {
  home: `<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>`,
  book: `<path d="M12 6c-2-1.6-5-2-8-1.5V18c3-.5 6-.1 8 1.5 2-1.6 5-2 8-1.5V4.5C17 4 14 4.400 12 6zM12 6v13.500"/>`,
  tool: `<path d="M14.500 6a4 4 0 0 0 5 5l-9 9a2.100 2.100 0 0 1-3-3l9-9a4 4 0 0 1 3.500-6l-2.500 2.500.500 2 2 .500z"/>`,
  file: `<path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM14 3v4h4M9 12h6M9 16h6"/>`,
  gear: `<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.600 5.600l2.100 2.100M16.300 16.300l2.100 2.100M5.600 18.400l2.100-2.100M16.300 7.700l2.100-2.100"/>`,
  prev: `<path d="M15 5l-7 7 7 7"/>`, next: `<path d="M9 5l7 7-7 7"/>`,
  reset: `<path d="M4 12a8 8 0 1 0 2.500-5.800M4 4v4.500h4.500"/>`,
  minus: `<path d="M5 12h14"/>`, plus: `<path d="M5 12h14M12 5v14"/>`,
  fit: `<path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/>`,
  expand: `<path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/>`,
  quiz: `<path d="M5 6l2 2 3-3.500M5 13l2 2 3-3.500M13 7h6M13 14h6M5 20h14"/>`,
  copy: `<rect x="8" y="8" width="11" height="12" rx="2"/><path d="M5 16V6a2 2 0 0 1 2-2h8"/>`
};
const ic = (n) => fig(`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`);
const $id = (id) => document.getElementById(id);
const app = $id("app"), stage = $id("stage"), side = $id("side"), strip = $id("strip"), page = $id("page");
const modBy = (id) => MODULES.find(m => m.id === id);
const stepsOf = (m) => [...m.cards.map((c, i) => ({ kind: "card", i, key: "c" + i, slug: String(i + 1), title: c.h })),
  { kind: "tool", key: "t", slug: "tool", title: "Try it: " + WIDGETS[m.widget].title }, { kind: "quiz", key: "q", slug: "quiz", title: `Quiz · ${m.quiz.length} questions` }];
const passed = (m) => (S.best[m.id]?.pct ?? 0) >= PASS;
const isDone = (m, st) => st.kind === "quiz" ? passed(m) : !!D.seen[m.id]?.[st.key];
const doneCount = (m) => stepsOf(m).filter(st => isDone(m, st)).length;
const bubble = (m) => h("div", { class: "bubble" + (passed(m) ? " done" : ""), "aria-hidden": "true" }, h("span", { class: "l" }, m.code), h("span", { class: "n" }, m.tag));

/* ---------- theme ---------- */
const thumbs = new Map();
function applyPrefs() {
  const r = document.documentElement;
  if (D.theme === "auto") delete r.dataset.theme; else r.dataset.theme = D.theme;
  if (D.motion === "off") r.dataset.motion = "off"; else delete r.dataset.motion;
  thumbs.clear();
}
const calm = () => D.motion === "off" || matchMedia("(prefers-reduced-motion: reduce)").matches;
/* a figure as a static image: avoids duplicate SVG ids next to the live figure on the stage */
function thumb(src) {
  if (thumbs.has(src)) return thumbs.get(src);
  let url = "";
  try {
    const el = fig(src); el.setAttribute("xmlns", SVGNS); el.removeAttribute("class");
    el.querySelectorAll("[data-tip]").forEach(n => n.removeAttribute("data-tip"));
    const st = document.createElementNS(SVGNS, "style");
    st.textContent = "text{font-family:monospace;font-size:10px}text:not([fill]){fill:var(--ink)}.lbl{font-weight:700}.sm{font-size:8.5px}.sm:not([fill]){fill:var(--muted)}";
    el.prepend(st);
    const xml = new XMLSerializer().serializeToString(el).replace(/var\(--([a-z-]+)\)/g, (_, n) => css("--" + n) || "#888");
    url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
  } catch {}
  thumbs.set(src, url); return url;
}

/* ---------- routing ---------- */
const PAGES = ["lessons", "tools", "textbook", "settings"];
function parse() {
  const r = (location.hash || "").slice(1);
  if (PAGES.includes(r)) return { view: r };
  const [mid, sp] = r.split("/");
  let m = modBy(mid), idx;
  if (!m) { m = modBy(D.last?.m) || MODULES[0]; idx = D.last?.m === m.id ? D.last.i : 0; }
  const steps = stepsOf(m);
  if (idx == null) { const k = steps.findIndex(s => s.slug === sp); idx = k >= 0 ? k : (sp == null ? (D.pos[m.id] ?? 0) : 0); }
  return { view: "bench", m, idx: clamp(idx, 0, steps.length - 1) };
}
const go = (hash) => { if ((location.hash || "").slice(1) === hash) render(); else location.hash = hash; };
const goStep = (m, idx) => go(m.id + "/" + stepsOf(m)[idx].slug);
addEventListener("hashchange", () => render());
let cur = null;

/* ---------- shell pieces ---------- */
function drawRail(active) {
  const rail = $id("rail"); rail.innerHTML = "";
  const item = (id, icon, label, onclick) => h("button", { type: "button", class: active === id ? "on" : "", "aria-current": active === id ? "page" : false, onclick }, ic(icon), label);
  rail.append(item("bench", "home", "Home", () => go(D.last ? D.last.m + "/" + stepsOf(modBy(D.last.m) || MODULES[0])[D.last.i].slug : "m1/1")),
    item("lessons", "book", "Lessons", () => go("lessons")), item("tools", "tool", "Tools", () => go("tools")),
    item("textbook", "file", "Textbook", () => go("textbook")), item("settings", "gear", "Settings", () => go("settings")),
    h("div", { class: "sp" }), h("a", { class: "phone", href: "./", title: "Open the phone version of this course" }, "Phone", h("br"), "version"));
}
let clockT = null;
function drawStatus(m) {
  const box = $id("status"); box.innerHTML = "";
  const nPass = MODULES.filter(passed).length;
  const label = m ? `${m.tag} · ${m.title}` : "Course progress";
  const n = m ? doneCount(m) : nPass, t = m ? stepsOf(m).length : MODULES.length;
  const clock = h("div", { class: "clock" });
  const tick = () => { const d = new Date(); clock.innerHTML = ""; clock.append(d.toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" }), h("br"), d.toLocaleTimeString([], { hour12: false })); };
  clearInterval(clockT); clockT = setInterval(tick, 1000); tick();
  box.append(h("div", { class: "prog", title: `${nPass} of ${MODULES.length} module quizzes passed` }, ic("book"),
    h("div", { class: "txt" }, h("div", { class: "lbl" }, label), h("div", { class: "bar" }, h("div", { class: "meter" }, h("i", { style: `width:${n / t * 100}%` })), h("span", { class: "cnt" }, `${n}/${t}`)))), clock);
}

/* ---------- stage: zoom, pan, callouts ---------- */
let Z = { k: 1, x: 0, y: 0 }, zoomer = null, pinned = null;
const applyZ = () => { if (zoomer) zoomer.style.transform = `translate(${Z.x}px,${Z.y}px) scale(${Z.k})`; placeCallout(); };
function zoomAt(f, cx, cy) {
  if (!zoomer) return;
  const k = clamp(Z.k * f, 0.6, 6), bx = zoomer.offsetLeft, by = zoomer.offsetTop;
  const lx = (cx - bx - Z.x) / Z.k, ly = (cy - by - Z.y) / Z.k;
  Z = { k, x: cx - bx - lx * k, y: cy - by - ly * k }; applyZ();
}
const zoomBtn = (f) => zoomAt(f, stage.clientWidth / 2, stage.clientHeight / 2);
const fitZ = () => { Z = { k: 1, x: 0, y: 0 }; applyZ(); };
let callEl = null, leadEl = null, callFor = null;
function showCallout(part) {
  callFor = part; if (!callEl) return;
  const txt = part.getAttribute("data-tip") || "", mt = txt.match(/^([^.:]{2,42}):\s+(.*)$/s);
  callEl.innerHTML = ""; if (mt) callEl.append(h("b", {}, mt[1]), mt[2]); else callEl.append(txt);
  callEl.classList.toggle("pinned", part === pinned); callEl.hidden = false; leadEl.style.display = ""; placeCallout();
}
function hideCallout() { callFor = null; if (callEl) { callEl.hidden = true; leadEl.style.display = "none"; } }
function placeCallout() {
  if (!callFor || !callEl || callEl.hidden) return;
  if (!document.body.contains(callFor)) return hideCallout();
  const sr = stage.getBoundingClientRect(), pr = callFor.getBoundingClientRect();
  const px = clamp(pr.left + pr.width / 2 - sr.left, 8, sr.width - 8), py = clamp(pr.top + pr.height / 2 - sr.top, 8, sr.height - 8);
  const cw = callEl.offsetWidth, ch = callEl.offsetHeight, gap = 34;
  const roomAbove = pr.top - sr.top, roomBelow = sr.bottom - pr.bottom;
  const above = roomAbove >= ch + gap + 8 || roomAbove > roomBelow;
  const cx = clamp(px - cw / 2 + (px < sr.width / 2 ? 60 : -60), 10, sr.width - cw - 10);
  const cy = above ? Math.max(8, pr.top - sr.top - gap - ch) : Math.min(sr.height - ch - 8, pr.bottom - sr.top + gap);
  callEl.style.left = cx + "px"; callEl.style.top = cy + "px";
  const ax = clamp(px, cx + 18, cx + cw - 18), ay = above ? cy + ch : cy;
  leadEl.innerHTML = `<path d="M${px} ${py} L${ax} ${ay}"/><circle cx="${px}" cy="${py}" r="5"/><circle cx="${ax}" cy="${ay}" r="4"/>`;
}
function hookParts(svg) {
  const parts = [...svg.querySelectorAll("[data-tip]")];
  parts.forEach(p => {
    p.setAttribute("tabindex", "0");
    p.addEventListener("pointerenter", () => showCallout(p));
    p.addEventListener("pointerleave", () => { if (pinned) showCallout(pinned); else hideCallout(); });
    p.addEventListener("focus", () => showCallout(p));
    const pin = () => { parts.forEach(q => q.classList.remove("on")); pinned = pinned === p ? null : p; if (pinned) p.classList.add("on"); showCallout(p); };
    /* a drag that ends on the part is not a click: only pin when the pointer barely moved */

function render() {
  const p = parse();
  if (p.view === "bench") renderBench(p.m, p.idx); else renderPage(p.view);
}
addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target, typing = t.matches?.("input,textarea,select,[role=slider],[contenteditable]");
  if (typing || !cur) return;
  if (quizKeys) { quizKeys(e); if (e.defaultPrevented) return; }

  else if (e.key === "ArrowLeft") { e.preventDefault(); if (cur.idx > 0 && !quizKeys) goStep(cur.m, cur.idx - 1); }
