<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Instrument Tech Fundamentals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: single-column field manual. Each module is a numbered "loop" with an ISA-style bubble; lessons step card by card like a checklist. */
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --sunk:#E3E8E6; --ink:#172024; --muted:#56646A; --line:#CCD4D1;
  --accent:#0E5C6B; --accent-ink:#FFFFFF; --accent-soft:#D6E9EC;
  --tag:#E2A200; --tag-ink:#1B1600;
  --ok:#24704A; --ok-soft:#DCEFE3; --bad:#A93C29; --bad-soft:#F6E0DB; --warn:#8A5A00; --warn-soft:#F7ECCF;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111719; --surface:#1A2225; --sunk:#232D31; --ink:#E6ECEA; --muted:#98A6AA; --line:#2F3B3F;
  --accent:#62B9C9; --accent-ink:#0B1A1D; --accent-soft:#1D3A40;
  --tag:#F0B429; --tag-ink:#1B1600;
  --ok:#5CC48A; --ok-soft:#173326; --bad:#F0806A; --bad-soft:#3A1F1A; --warn:#F0C060; --warn-soft:#352A12;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111719; --surface:#1A2225; --sunk:#232D31; --ink:#E6ECEA; --muted:#98A6AA; --line:#2F3B3F;
  --accent:#62B9C9; --accent-ink:#0B1A1D; --accent-soft:#1D3A40;
  --tag:#F0B429; --tag-ink:#1B1600;
  --ok:#5CC48A; --ok-soft:#173326; --bad:#F0806A; --bad-soft:#3A1F1A; --warn:#F0C060; --warn-soft:#352A12;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:2.3rem}h2{font-size:1.7rem}h3{font-size:1.3rem}
p{margin:0 0 .8em}ul,ol{margin:0 0 .8em;padding-left:1.25em}li{margin-bottom:.35em}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-size:.86rem;line-height:1.7;background:var(--sunk);padding:10px 12px;border-radius:8px;overflow-wrap:anywhere}
.formula{font-family:var(--mono);font-weight:700;font-size:1rem;background:var(--accent-soft);color:var(--ink);padding:10px 12px;border-radius:8px;text-align:center;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px;border-bottom:2px solid var(--ink);margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--display);font-size:1.15rem;letter-spacing:.04em;text-transform:uppercase}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--tag);box-shadow:0 0 0 3px var(--ink) inset}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ISA bubble */
.bubble{flex:none;width:58px;height:58px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;align-content:center;background:var(--surface);font-family:var(--mono);line-height:1}
.bubble .l{font-size:.62rem;font-weight:700;letter-spacing:.04em}
.bubble .n{font-size:1.05rem;font-weight:700;margin-top:3px}
.bubble.done{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.bubble.big{width:76px;height:76px}.bubble.big .l{font-size:.75rem}.bubble.big .n{font-size:1.4rem}

/* home */
.hero{display:grid;gap:10px;margin-bottom:22px}
.hero p{color:var(--muted);max-width:56ch}
.namebox{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:22px}
label{font-weight:600;font-size:.95rem}
input[type=text],input[type=number],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:120px;font-family:var(--mono);font-size:.85rem}
.overall{display:flex;align-items:center;gap:12px;margin:-6px 0 18px}
.meter{flex:1;height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:5px;transition:width .4s}
.modlist{display:grid;gap:0;border-top:1px solid var(--line)}
.mod{display:flex;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.mod:hover .t{color:var(--accent)}
.mod .txt{flex:1;min-width:0}
.mod .t{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.15}
.mod .s{color:var(--muted);font-size:.92rem}
.chip{display:inline-block;font-family:var(--mono);font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.new{background:var(--sunk);color:var(--muted)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.foot{margin-top:28px;font-size:.85rem;color:var(--muted)}

/* module */
.mhead{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.mhead .txt{min-width:0}
.book{font-size:.88rem;color:var(--muted);margin:6px 0 16px;padding:8px 12px;border-left:4px solid var(--tag);background:var(--surface)}
.steps{display:flex;gap:4px;margin:0 0 16px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--sunk)}
.steps i.on{background:var(--accent)}.steps i.cur{background:var(--tag)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 8px;min-width:0}
.sheet h2{margin-bottom:12px}
.sheet .cn{font-family:var(--mono);font-size:.75rem;color:var(--muted);margin-bottom:6px;letter-spacing:.08em}
.nav{display:flex;gap:10px;margin-top:14px}
.btn{appearance:none;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font-weight:700;font-size:1rem;padding:12px 18px;border-radius:8px;cursor:pointer;min-height:48px;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.grow{flex:1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:38px;padding:6px 12px;font-size:.9rem}

/* widget */
.widget{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>*{flex:1 1 140px;min-width:0}
.field{display:grid;gap:4px}
.field span{font-size:.85rem;color:var(--muted);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.ro{background:var(--sunk);border-radius:8px;padding:10px 12px}
.ro small{display:block;font-size:.72rem;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ro b{font-family:var(--mono);font-size:1.3rem;font-variant-numeric:tabular-nums}
.note{padding:10px 12px;border-radius:8px;font-size:.95rem}
.note.ok{background:var(--ok-soft);color:var(--ink);border-left:4px solid var(--ok)}
.note.bad{background:var(--bad-soft);color:var(--ink);border-left:4px solid var(--bad)}
.note.warn{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn)}
.note.info{background:var(--accent-soft);color:var(--ink);border-left:4px solid var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:1.5px solid var(--line);background:var(--bg);padding:8px 10px;border-radius:8px;font-weight:600;cursor:pointer;min-height:40px}
.seg button.sel{border-color:var(--accent);background:var(--accent-soft)}
.seg button.right{border-color:var(--ok);background:var(--ok-soft)}
.seg button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.sortitem{display:grid;gap:6px;padding:10px 0;border-bottom:1px dashed var(--line)}
.sortitem:last-child{border-bottom:0}
.sortitem .nm{font-weight:600}
.tagbreak{display:flex;flex-wrap:wrap;gap:8px}
.tagbreak div{background:var(--sunk);border-radius:8px;padding:8px 10px;min-width:0}
.tagbreak b{font-family:var(--mono);font-size:1.2rem;color:var(--accent);margin-right:6px}
.orderlist{display:grid;gap:8px}
.orderlist button{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:500;display:flex;gap:10px;align-items:center;min-height:48px}
.orderlist button .k{font-family:var(--mono);font-weight:700;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);flex:none;font-size:.8rem}
.orderlist button.done{border-color:var(--ok);background:var(--ok-soft)}
.orderlist button.done .k{background:var(--ok);color:var(--surface)}
.orderlist button.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.caltable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
.caltable th{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px}
.caltable td{padding:4px;border-top:1px solid var(--line)}
.caltable input{padding:6px 8px;font-family:var(--mono);font-size:16px;min-width:0;width:100%}
.tablewrap{overflow-x:auto}
canvas{width:100%;display:block;background:var(--bg);border-radius:8px;border:1px solid var(--line)}
.tank{display:flex;gap:14px;align-items:flex-end}
.tank svg{flex:none}

/* quiz */
.q{font-size:1.15rem;font-weight:600;margin-bottom:14px;line-height:1.35}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:1rem;display:flex;gap:12px;align-items:flex-start;min-height:52px}
.opt .k{font-family:var(--mono);font-weight:700;color:var(--muted);flex:none}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{margin-top:12px}
.qcount{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}

/* results */
.score{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.ring{flex:none;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:1.5rem}
.report{white-space:pre-wrap;font-family:var(--mono);font-size:.8rem;background:var(--sunk);border-radius:8px;padding:12px;user-select:all;-webkit-user-select:all;overflow-wrap:anywhere;margin:0}
.stack{display:grid;gap:10px}
.missed{display:grid;gap:8px;margin-top:6px}
.missed div{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:.93rem}

/* tracker */
.grid{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.85rem;min-width:100%}
.grid th,.grid td{padding:6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.grid th:first-child,.grid td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
.grid th{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.cell{display:inline-block;min-width:44px;padding:3px 6px;border-radius:6px;font-family:var(--mono);font-weight:700;font-size:.78rem}
.cell.ok{background:var(--ok-soft);color:var(--ok)}.cell.bad{background:var(--bad-soft);color:var(--bad)}.cell.none{color:var(--line)}
.sublist{display:grid;gap:0}
.sub{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sub .txt{flex:1;min-width:0}
.linkrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.linkrow .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.section{margin-top:26px;display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}

/* illustrations */
.art{display:block;width:100%;height:auto;max-width:100%;background:var(--sunk);border-radius:8px;margin:2px 0 12px}
.art text{font-family:var(--mono);font-size:10px}
.art text:not([fill]){fill:var(--ink)}
.art .lbl{font-weight:700}
.art .sm{font-size:8.5px}
.art .sm:not([fill]){fill:var(--muted)}
.art [data-tip]{cursor:pointer}
.art [data-tip]:hover,.art [data-tip].on{filter:drop-shadow(0 0 3px var(--tag))}
.tipbox{font-size:.93rem;padding:9px 12px;border-radius:8px;background:var(--warn-soft);border-left:4px solid var(--tag);margin:-4px 0 12px}
.tiphint{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;color:var(--muted);margin:-6px 0 10px;text-transform:uppercase}
@keyframes flowdash{to{stroke-dashoffset:-24}}
.art .flow{stroke-dasharray:6 6;animation:flowdash 1.2s linear infinite}
.art .flow.fast{animation-duration:.5s}.art .flow.slow{animation-duration:2.4s}.art .flow.rev{animation-direction:reverse}
@keyframes pulse{50%{opacity:.35}}
.art .pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.art .bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box}
@keyframes spin{to{transform:rotate(360deg)}}
.art .spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes sway{0%,100%{transform:rotate(-35deg)}50%{transform:rotate(35deg)}}
.art .sway{animation:sway 4s ease-in-out infinite;transform-box:view-box}

/* interactive figures */
.ihost{display:grid;gap:10px;margin:0 0 14px}
.ictl{display:grid;gap:10px}
.ictl:empty{display:none}
.islider span,.ilabel{font-size:.88rem;font-weight:700;color:var(--ink)}
.ibtns{display:flex;flex-wrap:wrap;gap:8px}
.ro.ok{background:var(--ok-soft)}.ro.bad{background:var(--bad-soft)}.ro.warn{background:var(--warn-soft)}
.ro.ok b{color:var(--ok)}.ro.bad b{color:var(--bad)}
.itasks{background:var(--surface);border:2px dashed var(--tag);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.itask{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;line-height:1.35}
.ibox{flex:none;width:20px;height:20px;border-radius:5px;border:2px solid var(--muted);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--surface)}
.itask.ok{color:var(--muted)}.itask.ok .ibox{background:var(--ok);border-color:var(--ok)}
.idone{font-weight:700;color:var(--ok);font-size:.93rem}
.art .idrag{cursor:grab;touch-action:none}.art .idrag:active{cursor:grabbing}
.art .ihandle{cursor:grab;touch-action:none}
@keyframes iring{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.7);opacity:0}}
.art .iring{animation:iring 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.ihist .art{margin:0}
.cardtag{display:inline-block;font-family:var(--mono);font-size:.68rem;font-weight:700;letter-spacing:.08em;background:var(--tag);color:var(--tag-ink);padding:2px 7px;border-radius:4px;margin-left:8px;vertical-align:2px}
@media (prefers-reduced-motion: reduce){.art *{animation:none!important}}

/* reviewer mode */
.revbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--warn-soft);border-left:4px solid var(--tag);padding:6px 12px;border-radius:6px;margin:-8px 0 16px;font-size:.92rem}
.fbbox{display:grid;gap:8px;margin-top:12px;padding:12px;border:2px solid var(--tag);border-radius:10px;background:var(--surface)}
.fbbox textarea{min-height:70px;font-family:var(--body);font-size:16px}
.fbseg button.sel.fb-ok{border-color:var(--ok);background:var(--ok-soft)}
.fbseg button.sel.fb-fix{border-color:var(--warn);background:var(--warn-soft)}
.fbseg button.sel.fb-wrong{border-color:var(--bad);background:var(--bad-soft)}
.akey{margin-top:10px}.akey ol{margin:0 0 6px}.akright{font-weight:700;color:var(--ok)}
.fbsub summary{cursor:pointer;padding:4px 0}

.book{display:grid;gap:8px}
.bookbtn .btn{min-height:40px}
.chlist{display:grid;border-top:1px solid var(--line)}
.chlist a{display:grid;grid-template-columns:2.2em 1fr auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.chlist a:hover span:nth-child(2){color:var(--accent)}
.mono-sm{font-family:var(--mono);font-weight:700;font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script src="course.js"></script>
<script>
const ARTIFACT_URL = "https://jmjcoke.github.io/instrument-tech-training/";  // public, no sign-in
const PUBLIC_COPY = true;
const TRAINER_PHONE = "";     // optional: trainer's mobile number for the Text button
const PASS = 75;
const BOOK_URL = "https://www.ibiblio.org/kuphaldt/socratic/sinst/book/liii.pdf";
const CH_MB = { m1: 1.6, m2: 1.2, m3: 2.1, m4: 1.0, m5: 0.6, m6: 6.7, m7: 2.3, m8: 9.8, m9: 11.3, m10: 16.8, m11: 4.0 };
const chapterLink = (m, cls = "btn small") => h("a", { class: cls, href: `${ARTIFACT_URL}chapters/${m.id}.pdf`, target: "_blank", rel: "noopener" }, `Read the chapter (PDF, ${CH_MB[m.id]} MB)`);
const COURSE = "Instrument Tech Fundamentals";

/* ---------- per-device progress (convenience only) ---------- */
const LS = "itt.v1";
const load = () => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch { return {}; } };
let S = Object.assign({ name: "", best: {}, tries: {}, fb: {} }, load());
const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch {} };
/* reviewer mode: the #review link turns it on for this phone, #student turns it off */
if ((location.hash || "") === "#review") { S.mode = "review"; save(); }
if ((location.hash || "") === "#student") { delete S.mode; save(); }
const REVIEW = () => S.mode === "review";

/* ---------- results code ---------- */
const b64e = (s) => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const b64d = (s) => decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/"))));
const makeCode = (r) => "ITT1." + b64e(JSON.stringify(r));
const readCode = (c) => { try { const r = JSON.parse(b64d(c.slice(5))); return r && r.m && typeof r.s === "number" ? r : null; } catch { return null; } };
const hashStr = (s) => { let x = 5381; for (let i = 0; i < s.length; i++) x = (x * 33 ^ s.charCodeAt(i)) >>> 0; return x.toString(36); };

/* ---------- platform (trainer tracker storage) ---------- */
let DB = null, USER = null, EDITOR = false, platformReady = false;
(async () => {
  try { USER = await window.claude?.use?.("user"); EDITOR = USER ? !!(await USER.canEdit()) : false; } catch {}
  try { DB = await window.claude?.use?.("db"); } catch {}
  platformReady = true;
  if (["", "home", "tracker"].includes(route())) render();
})();

/* ---------- routing ---------- */
const route = () => (location.hash || "").replace("#", "");
const go = (r) => { if (route() === r) render(); else location.hash = r; scrollTo(0, 0); };
addEventListener("hashchange", () => { render(); scrollTo(0, 0); });
const app = document.getElementById("app");
const modBy = (id) => MODULES.find(m => m.id === id);

/* ---------- reviewer feedback ---------- */
const fbCount = () => Object.keys(S.fb || {}).length;
const RATE = { ok: "Looks good", fix: "Needs a fix", wrong: "Technically wrong" };
function keyLabel(k) {

  const [mid, part] = k.split(":"), m = modBy(mid); if (!m) return k;
  const pre = `M${m.tag} ${m.title}`;
  if (part === "t") return `${pre} · Try it: ${WIDGETS[m.widget]?.title || ""}`;
  if (part[0] === "c") return `${pre} · Lesson ${+part.slice(1) + 1}: ${m.cards[+part.slice(1)]?.h || ""}`;
  if (part[0] === "q") { const q = m.quiz[+part.slice(1)]; return `${pre} · Quiz Q${+part.slice(1) + 1}: ${q ? q.q.slice(0, 70) : ""}`; }
  return pre;
}
const keyOrder = (k) => { if (k === "course") return -1; const [mid, part] = k.split(":"); const mi = MODULES.findIndex(m => m.id === mid); const o = part[0] === "c" ? +part.slice(1) : part === "t" ? 50 : 100 + +part.slice(1); return mi * 1000 + o; };
function fbBox(key, label, placeholder) {

  const cur = S.fb[key] || {}, stat = h("span", { class: "small muted", "aria-live": "polite" }, cur.r || cur.n ? "Saved on this phone" : "");
  const note = h("textarea", { rows: 3, id: "fb-" + key.replace(/[^a-z0-9]/gi, "-"), placeholder: placeholder || "What should change? Anything wrong, unclear, or missing for the field?" }); note.value = cur.n || "";
  const seg = h("div", { class: "seg fbseg" }); seg.dataset.r = cur.r || "";
  const store = () => { const r = seg.dataset.r, n = note.value.trim(); if (!r && !n) delete S.fb[key]; else S.fb[key] = { r, n, t: Date.now() }; save(); stat.textContent = S.fb[key] ? "Saved on this phone" : ""; document.querySelectorAll(".revbar span").forEach(e => e.innerHTML = `<b>Reviewer mode</b> · ${fbCount()} note${fbCount() === 1 ? "" : "s"}`); };
  Object.entries(RATE).forEach(([v, t]) => seg.append(h("button", { type: "button", class: "fb-" + v + (cur.r === v ? " sel" : ""), onclick: () => { seg.dataset.r = seg.dataset.r === v ? "" : v; [...seg.children].forEach(b => b.classList.toggle("sel", b.classList.contains("fb-" + seg.dataset.r))); store(); } }, t)));
  note.addEventListener("input", store);
  return h("div", { class: "fbbox" }, h("div", { class: "eyebrow" }, "Reviewer feedback"), h("div", { class: "small muted" }, label), seg, note, stat);
}
const makeFbCode = (o) => "ITF1." + b64e(JSON.stringify(o));
function renderFeedback() {
  const keys = Object.keys(S.fb).sort((a, b) => keyOrder(a) - keyOrder(b));

  const out = h("div", { class: "stack" });

    out.innerHTML = "";

    if (!S.name) { out.append(h("div", { class: "note warn" }, "Add your name above so the trainer knows who sent this.")); return; }
    const when = new Date().toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" });
    const lines = keys.map(k => { const f = S.fb[k]; return `• ${keyLabel(k)}\n  ${f.r ? RATE[f.r].toUpperCase() : "NOTE"}${f.n ? ": " + f.n : ""}`; });
    const counts = Object.keys(RATE).map(r => `${keys.filter(k => S.fb[k].r === r).length} ${RATE[r].toLowerCase()}`).join(", ");
    const txt = `${COURSE} · REVIEWER FEEDBACK\nReviewer: ${S.name}\n${keys.length} notes (${counts}) · ${when}\n\n${lines.join("\n")}\n\nCode: ${makeFbCode({ v: 1, n: S.name, d: Math.round(Date.now() / 1000), f: keys.map(k => [k, S.fb[k].r || "", S.fb[k].n || ""]) })}`;
    const pre = h("pre", { class: "report" }, txt), copied = h("div", { class: "small muted", "aria-live": "polite" });
    const copy = h("button", { class: "btn primary grow", type: "button", onclick: async () => {
      try { await navigator.clipboard.writeText(txt); copied.textContent = "Copied. Paste it into a text to the trainer."; }
      catch { const sel = getSelection(), rg = document.createRange(); rg.selectNodeContents(pre); sel.removeAllRanges(); sel.addRange(rg); copied.textContent = "Selected. Use your phone's Copy, then paste it into a text to the trainer."; } } }, "Copy my feedback");
    const sms = h("a", { class: "btn grow", href: `sms:${TRAINER_PHONE}?&body=${encodeURIComponent(txt)}` }, "Open in Messages");
    out.append(h("div", { class: "nav", style: "margin:0;flex-wrap:wrap" }, copy, sms), copied, pre);
  };

  let armed = false;
  const clear = h("button", { class: "btn small", type: "button", onclick: () => { if (!armed) { armed = true; clear.textContent = "Tap again to clear all notes"; setTimeout(() => { armed = false; clear.textContent = "Clear my notes"; }, 4000); return; } S.fb = {}; save(); render(); } }, "Clear my notes");
  app.append(topbar(h("button", { class: "linkbtn", onclick: () => go("home") }, "All modules")),
    h("div", { class: "hero" }, h("div", { class: "eyebrow" }, "Reviewer"), h("h1", {}, "Send your feedback"), h("p", {}, `You have ${keys.length} note${keys.length === 1 ? "" : "s"}. Copy them and text them to the trainer. You can keep reviewing and send again later; the trainer's tracker skips anything already received.`)),
    h("div", { class: "namebox" }, h("label", { for: "fbnm" }, "Your name"), nameIn), out,
    keys.length ? h("div", { class: "section" }, h("h2", {}, "Your notes"), ...keys.map(k => h("div", { class: "sub" }, h("div", { class: "txt" }, h("b", {}, keyLabel(k)), h("br"), h("span", { class: "small" }, S.fb[k].n || "")), S.fb[k].r ? h("span", { class: "chip " + ({ ok: "ok", fix: "warn", wrong: "bad" })[S.fb[k].r] }, RATE[S.fb[k].r]) : "")), h("div", {}, clear)) : "");

/* tracker side: store and show reviewer feedback */
let FBROWS = [], fbUnsub = null;
const localFb = () => { try { return JSON.parse(localStorage.getItem("itt.feedback")) || []; } catch { return []; } };
async function addFeedback(codes, usingDb) {
  let n = 0;
  for (const c of codes) {
    let o; try { o = JSON.parse(b64d(c.slice(5))); } catch { continue; } if (!o || !Array.isArray(o.f)) continue;
    const id = "f" + hashStr(c); if (FBROWS.some(x => x._id === id)) continue;
    const row = { name: String(o.n || "Reviewer").slice(0, 80), at: o.d || Math.round(Date.now() / 1000), notes: o.f.slice(0, 400).map(([k, r, t]) => ({ k: String(k), r: String(r || ""), n: String(t || "").slice(0, 2000) })) };
    if (usingDb) { try { await DB.collection("feedback").doc(id).set(row); n++; } catch {} } else { FBROWS.push({ ...row, _id: id }); try { localStorage.setItem("itt.feedback", JSON.stringify(FBROWS)); } catch {} n++; }
  }
  if (!usingDb) drawFb();
  return n;
}
let fbHost = null;
function fbSection(usingDb, msg) {
  fbHost = h("div", { class: "stack" });
  if (fbUnsub) { fbUnsub(); fbUnsub = null; }
  if (usingDb) fbUnsub = DB.collection("feedback").onSnapshot((snap) => { FBROWS = snap.docs.map(d => ({ ...d.data(), _id: d.id })); drawFb(); }, () => {});
  else FBROWS = localFb();
  setTimeout(drawFb, 0);
  return h("div", { class: "section" }, h("h2", {}, "Reviewer feedback"), fbHost);
}
function drawFb() {
  if (!fbHost || !document.body.contains(fbHost)) return; fbHost.innerHTML = "";
  if (!FBROWS.length) { fbHost.append(h("div", { class: "note info" }, "No reviewer feedback yet. Send an experienced tech the reviewer link below. When they text back their feedback, paste it in the box above.")); return; }
  [...FBROWS].sort((a, b) => b.at - a.at).forEach(fr => {
    const notes = [...fr.notes].sort((a, b) => keyOrder(a.k) - keyOrder(b.k));
    const bad = notes.filter(x => x.r === "wrong").length, fix = notes.filter(x => x.r === "fix").length;
    fbHost.append(h("details", { class: "sheet fbsub" }, h("summary", {}, h("b", {}, fr.name), ` · ${notes.length} notes · ${new Date(fr.at * 1000).toLocaleDateString([], { month: "short", day: "numeric" })}`, bad ? h("span", { class: "chip bad", style: "margin-left:8px" }, `${bad} wrong`) : "", fix ? h("span", { class: "chip warn", style: "margin-left:6px" }, `${fix} to fix`) : ""),
      ...notes.map(x => h("div", { class: "sub" }, h("div", { class: "txt" }, h("b", { class: "small" }, keyLabel(x.k)), h("br"), h("span", {}, x.n || "")), x.r ? h("span", { class: "chip " + ({ ok: "ok", fix: "warn", wrong: "bad" })[x.r] }, RATE[x.r]) : ""))));
  });
}
